{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} — Portfolio App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'dashboard/css/style.css' %}">
    {% block extra_css %}{% endblock %}
</head>

<body>
    <nav class="navbar">
        <div class="navbar__brand">
            <span class="navbar__brand-icon">◈</span>
            Portfolio App
        </div>
        <ul class="navbar__nav">
            <li><a href="{% url 'dashboard:index' %}"
                    class="navbar__link {% block nav_dashboard %}{% endblock %}">Dashboard</a></li>
            <li><a href="{% url 'applications:list' %}"
                    class="navbar__link {% block nav_applications %}{% endblock %}">Applications</a></li>
        </ul>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        Portfolio App &middot; Application Catalog Dashboard
    </footer>

    {% block extra_js %}{% endblock %}
</body>

</html>
